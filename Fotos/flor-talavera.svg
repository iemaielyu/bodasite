<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100">
  <!-- Fondo crema -->
  <rect width="100" height="100" fill="#F9F3EA" />

  <!-- Flor central -->
  <circle cx="50" cy="50" r="10" fill="#D05A2F" />

  <!-- Pétalos en cruz -->
  <path d="M50,20 A30,30 0 0,1 70,50 A30,30 0 0,1 50,80 A30,30 0 0,1 30,50 A30,30 0 0,1 50,20 Z" fill="none" stroke="#D05A2F" stroke-width="5" />

  <!-- Pétalos diagonales (forma de estrella/flor de 8 puntas) -->
  <circle cx="65" cy="35" r="6" fill="#D05A2F" />
  <circle cx="35" cy="35" r="6" fill="#D05A2F" />
  <circle cx="65" cy="65" r="6" fill="#D05A2F" />
  <circle cx="35" cy="65" r="6" fill="#D05A2F" />
</svg>
